version: "3.8"

services:
  # 1. Merinos AI API (FastAPI)
  merinos-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/models/lora_adapters
      - BASE_MODEL=unsloth/Qwen2.5-7B-Instruct-bnb-4bit
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./merinos_7b_8gb/lora_adapters:/models/lora_adapters:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Merinos RAG API
  merinos-rag:
    build:
      context: .
      dockerfile: Dockerfile.rag
    ports:
      - "8001:8001"
    environment:
      - MODEL_PATH=/models/lora_adapters
      - INDEX_DIR=/rag_index
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./merinos_7b_8gb/lora_adapters:/models/lora_adapters:ro
      - ./rag_index:/rag_index:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      - merinos-api

  # 3. Prometheus (metrik toplama)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # 4. Grafana (dashboard)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=merinos2024
    restart: unless-stopped
    depends_on:
      - prometheus

  # 5. Nginx (reverse proxy)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - merinos-api
      - merinos-rag
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
